repositories {
    maven {
        url 'https://jitpack.io'
    }
}

def unimixinsVersion = project.findProperty('unimixinsVersion')

dependencies {
    implementation("com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:$unimixinsVersion:dev")
    annotationProcessor("com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:$unimixinsVersion:dev")
}

runClient {
    args("--tweakClass", "org.spongepowered.asm.launch.MixinTweaker")
}

runServer {
    args("--tweakClass", "org.spongepowered.asm.launch.MixinTweaker")
}

def outSrgFile = "${tasks.compileJava.temporaryDir}/outSrg.srg"
def outRefMapFile = "${tasks.compileJava.temporaryDir}/mixins.${modId}.refmap.json"

jar {
    manifest {
        // TweakClass keeps this jar on FML's tweak list, and FML adds any jar that
        // declares it to the "loaded coremods" list, which the mod discovery skips
        // ("Skipping already parsed coremod or tweaker"). ForceLoadAsMod makes Mixin's
        // FML platform agent remove this jar from that list again (see
        // MixinPlatformAgentFMLLegacy.loadAsMod), which is what gets the jar loaded as
        // a regular mod. FMLCorePluginContainsFMLMod, despite its historical name, is
        // what makes the same agent add a tweaker jar that is not on the boot class
        // path to FML's "reparseable coremods" collection; that collection is skipped
        // during class path mod discovery, and without it the jar is found twice (once
        // on the class path, where the tweaker was injected, and once in the mods
        // directory), which FML rejects as a duplicate mod. MixinConfigs carries the
        // ordinary config; the container is registered by Mixin itself because the
        // manifest declares the mixin tweaker (see
        // MixinServiceLaunchWrapper.getContainersFromClassPath). FMLAT declares the
        // access transformer shipped inside the jar: FML's ModAccessTransformer reads
        // this manifest attribute first and silently ignores META-INF/*_at.cfg when it
        // is absent (see CoreModManager.addJar).
        attributes (
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                'ForceLoadAsMod': 'true',
                'FMLCorePluginContainsFMLMod': 'true',
                'MixinConfigs': "mixins.${modId}.json",
                'FMLAT': 'catframe_at.cfg',
        )
    }

    from outRefMapFile;
}

tasks.compileJava.options.compilerArgs += ["-AreobfSrgFile=${tasks.reobf.srg}", "-AoutSrgFile=${outSrgFile}", "-AoutRefMapFile=${outRefMapFile}"];

reobf {
    addExtraSrgFile outSrgFile
}